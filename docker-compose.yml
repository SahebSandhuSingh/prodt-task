version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_booking
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
