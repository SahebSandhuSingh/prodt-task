services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_booking
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: travel_booking_api
    command: sh -c "alembic upgrade head 2>/dev/null || alembic stamp head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/travel_booking
      - TEMPORAL_HOST=${TEMPORAL_HOST:-host.docker.internal:7233}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: travel_booking_worker
    command: python worker.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/travel_booking
      - TEMPORAL_HOST=${TEMPORAL_HOST:-host.docker.internal:7233}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
